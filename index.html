<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twencraft Animation Studio</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header class="toolbar">
        <div class="logo">🎬 TWENCRAFT STUDIO</div>
        <div class="toolbar-group">
            <span id="timeDisplay" style="font-size: 13px; color: #e94560; font-weight: bold;">الوقت: 0.0s</span>
            <select id="easingSelect">
                <option value="easeInOut">Ease In-Out (سلس)</option>
                <option value="linear">Linear (خطي)</option>
            </select>
            <button id="resetPoseBtn">🧍 إعادة تعيين</button>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="workspace">
            <canvas id="canvas" width="850" height="520"></canvas>
        </main>
    </div>

    <footer class="timeline">
        <div class="timeline-controls">
            <button id="playBtn">▶️ تشغيل المشهد</button>
            <button id="clearTimelineBtn">🗑️ مسح الكل</button>
            <div class="scrub-area">
                <span style="font-size:11px;">الزمن:</span>
                <input type="range" id="timeScrubber" min="0" max="5" step="0.1" value="0">
            </div>
            <span id="keyframeCount" style="font-size: 11px; color: #a0aec0;">الـ Keyframes: 0</span>
        </div>
    </footer>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
