<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twencraft Upload Studio</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header class="toolbar">
        <div class="logo">🦴 TWENCRAFT STUDIO</div>
        <div class="toolbar-group">
            <label style="font-size:12px;">التسهيل:</label>
            <select id="easingSelect">
                <option value="easeInOut">Ease In-Out (سلس)</option>
                <option value="linear">Linear (خطي)</option>
            </select>
            <button id="onionBtn">🧅 قشر البصل: معطل</button>
            <button id="resetPoseBtn">🧍 إعادة تعيين</button>
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="workspace">
            <canvas id="canvas" width="850" height="520"></canvas>
        </main>
    </div>

    <footer class="timeline">
        <div class="timeline-top">
            <button id="saveKeyframeBtn">📸 إضافة فريم</button>
            <button id="playBtn">▶️ تشغيل</button>
            <button id="clearFramesBtn">🗑️ مسح الكل</button>
            <div class="scrub-area">
                <span style="font-size:11px;">الزمن:</span>
                <input type="range" id="scrubBar" min="0" max="100" value="0">
            </div>
            <span id="frameCount" style="font-size: 11px; color: #a0aec0;">الفريمات: 0</span>
        </div>
        <div class="frames-track" id="framesTrack"></div>
    </footer>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
